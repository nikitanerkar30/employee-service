apiVersion: apps/v1
kind: Deployment

metadata:
  name: employee-service
  namespace: employee-dev
spec: 
  replicas: 2
  selector:
     matchLabels:
       app: employee-service
  template:
    metadata:
      labels:
        app: employee-service

    spec:
       containers:
        - name: employee-service
          image: nikitaharesh/employee-service:latest
          ports:
            - containerPort: 8080
          envFrom:
             - configMapRef:
                 name: employee-config
             - secretRef:
                 name: employee-secret

               
